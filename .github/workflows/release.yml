name: Release DMG
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to verify before publication
        required: true
        default: '0.1.4'
      bootstrap_credentials:
        description: Build the credential service once for review and freezing
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test
        run: swift run CalendarChecks
      - name: Build universal DMG
        env:
          CALENDAR_SIGNING_P12: ${{ secrets.CALENDAR_SIGNING_P12 }}
          CALENDAR_SIGNING_PASSWORD: ${{ secrets.CALENDAR_SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          BOOTSTRAP_CREDENTIALS: ${{ inputs.bootstrap_credentials || 'false' }}
        run: |
          VERSION="${RELEASE_VERSION#v}" python3 scripts/release-build.py
      - name: Preserve credential service for review
        if: ${{ always() && inputs.bootstrap_credentials }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: credential-service-v1
          path: |
            dist/CalendarCredentials-v1.tar.gz
            dist/CalendarCredentials-v1.tar.gz.sha256
          if-no-files-found: error
      - name: Publish release
        if: ${{ !inputs.bootstrap_credentials }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          TAG="v${RELEASE_VERSION#v}"
          OPTIONS=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then OPTIONS+=(--draft); fi
          gh release create "$TAG" dist/*.dmg dist/*.sha256 --target "$GITHUB_SHA" --title "Calendar Bar $TAG" --notes-file docs/RELEASE.md "${OPTIONS[@]}"
